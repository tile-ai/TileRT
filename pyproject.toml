[project]
name = "tilert"
dynamic = ["version"]

description = "TileRT"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TileRT-team", email = "contact@tilert.ai"}]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # The v0.1.6 wheel carries backends for two torch ABIs, hence the range:
    # the CUDA backends (DeepSeek-V3.2, GLM-5) need ``torch==2.11.0+cu130``
    # from PyTorch's cu130 index (``--index-url
    # https://download.pytorch.org/whl/cu130``), the ROCm backend (GLM-5.2/5.3)
    # needs ``torch==2.12.0+rocm7.14.0``. ``tilert.load_backend`` refuses a
    # torch of the wrong version or flavor, so install the matching one first.
    "torch>=2.11,<2.13",
    "transformers>=4.46.3",
    "tokenizers>=0.20.3",
    "safetensors",
    "numpy",
    "scipy",
    "einops",
]

[project.optional-dependencies]
# Runtime dependencies of the PD router and decode server (``tilert.pd_vllm``).
pd = [
    "fastapi",
    "uvicorn",
    "httpx",
    "requests",
    "pydantic",
]
dev = [
    "pytest>=7.0.0",
    "black==25.1.0",
    "flake8==7.1.2",
    "flake8-bugbear==24.12.12",
    "flake8-comprehensions==3.16.0",
    "flake8-docstrings==1.7.0",
    "flake8-simplify==0.21.0",
    "flake8-unused-arguments==0.0.13",
    "flake8-variables-names==0.0.6",
    "flake8-return==1.2.0",
    "flake8-print==5.0.0",
    "isort==6.0.1",
    "mypy==1.15.0",
    "bandit==1.8.3",
    "pyupgrade==3.19.1",
    "commitizen==4.4.1",
    "codespell==2.4.1",
    "pre-commit>=3.0.0",
    "mdformat==0.7.17",
    "mdformat-gfm==0.4.1",
    "mdformat-frontmatter==2.0.8",
    "mdformat-myst==0.2.1",
    "mdformat-tables==1.0.0",
    "mdformat-toc==0.3.0",
    "mdformat-black==0.1.1",
    "types-setuptools",
    "types-requests",
    "types-urllib3",
    "types-six",
    "tomli==2.2.1",
]

[project.urls]
Homepage = "https://github.com/tile-ai/TileRT"
Issues = "https://github.com/tile-ai/TileRT/issues"

# Note: this repository ships the public Python sources of the v0.1.6.post2
# wheel. They are recovered from the wheel itself, which ships them without
# docstrings or comments, and reformatted to this repo's lint config;
# ``tilert/generate.py`` also carries a CLI fix that no published wheel has yet.
# The wheel itself is built in the development repo (TileRT-dev/TileRT) with
# scikit-build-core; no [build-system] block is declared here on purpose so
# nobody accidentally runs ``pip wheel .`` against this presentation copy.

[tool.black]
line-length = 100
target-version = ["py311"]
preview = true
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | _build
  | build
  | dist
  | 3rd-party
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
skip_glob = ["3rd-party/**/*"]
known_first_party = ["tilert"]

[tool.mypy]
python_version = "3.11"  # Base version for type checking
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
ignore_missing_imports = true
exclude = ["3rd-party/"]
explicit_package_bases = true

# pd_vllm is glue over vLLM's connector API; its interface methods take
# ``Any``-typed params by contract, so full def-level annotation is low value.
# Relax annotation-completeness there. Since v0.1.6 the sources are recovered
# from the published wheel, which ships them without comments, so per-line
# ``# type: ignore``s are not available either: the error codes that occur in
# the exported code are disabled, and the remaining checks still apply.
[[tool.mypy.overrides]]
module = "tilert.pd_vllm.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "func-returns-value",
    "index",
    "misc",
    "return-value",
    "type-var",
    "union-attr",
    "unreachable",
    "var-annotated",
]

# The ROCm port (GLM-5.2/5.3 on MI350X/MI355X) comes from the same wheel export.
[[tool.mypy.overrides]]
module = [
    "tilert.models.glm_5_2_rocm.*",
    "tilert.models.misc_rocm.*",
    "tilert.models.base_rocm",
    "tilert.models.common_mxfp4",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
disable_error_code = ["assignment", "attr-defined", "dict-item", "index", "union-attr"]

[tool.bandit]
exclude_dirs = ["tests", "3rd-party"]
skips = ["B101", "B311", "B404", "B603", "B607"]
ignore_nosec = false

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "E252"]
exclude = [".git", "__pycache__", "build", "dist", "3rd-party"]
docstring-convention = "google"
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D212",
    "D213",
    "D406",
    "D407",
    "D408",
    "D409",
    "D410",
    "D411",
    "D412",
    "D413",
    "D414",
    "D415",
    "D416",
    "D417",
    "D418",
    "D419",
    "T201",
    "VNE001",
]

[tool.flake8.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D100", "D101", "D102", "D103"]
"setup.py" = ["D100", "D101", "D102", "D103", "B009"]

[tool.flake8.bugbear]
extend-select = ["B"]
ignore = ["B007"]  # Loop control variable not used within loop body

[tool.flake8.comprehensions]
extend-select = ["C4"]

[tool.flake8.simplify]
extend-select = ["SIM"]

[tool.flake8.unused-arguments]
extend-select = ["ARG"]

[tool.flake8.variables-names]
extend-select = ["N"]

[tool.flake8.return]
extend-select = ["RET"]

[tool.flake8.print]
extend-select = ["T"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
bump_message = "bump: version $current_version → $new_version [skip ci]"
update_changelog_on_bump = true
major_version_zero = true

[tool.pyupgrade]
py311-plus = true
args = ["--keep-percent-format", "--py311-plus"]

[tool.codespell]
skip = "3rd-party,*.git,*.pyc,build,dist,*.egg-info,.mypy_cache,.pytest_cache,"
check-hidden = true
ignore-words-list = "ThrID,pres"

[tool.mdformat]
number = true
wrap = "keep"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "0.1.0"
tag_regex = "^(?P<prefix>v)?(?P<version>\\d+\\.\\d+\\.\\d+(?:-(?:alpha|beta|rc)\\.\\d+)?)$"
